repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,E501,W503"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or:
          [javascript, jsx, ts, tsx, css, scss, json, yaml, markdown, html]
        exclude: ^(dist/|node_modules/|build/|docs/support\.js)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        exclude: ^(dist/|node_modules/|build/|docs/support\.js)
        additional_dependencies: ["eslint@8.57.0"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.28.0
    hooks:
      - id: check-jsonschema
        name: check-jsonschema (theme presets)
        files: ^(docs/[^/]+\.json|themes/[^/]+\.json|themes/examples/[^/]+\.json|ktheme-pr/themes/community/[^/]+\.json)$
        types: [json]
        args: ["--schemafile", "schemas/theme.schema.json"]

  - repo: local
    hooks:
      - id: ktheme-style-lint
        name: ktheme-style-lint
        entry: python3 scripts/ktheme-style-lint.py
        language: python
        types_or: [javascript, jsx, ts, tsx, css, html]
        exclude: ^(dist/|node_modules/|build/|schemas/|tests/|docs/support\.js|docs/cf-system\.js|docs/cf-ui\.css|docs/index\.html|docs/app\.dc\.html|docs/theme-system\.dc\.html)
